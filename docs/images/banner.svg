<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="pi-dispatch — run the pi coding agent as a self-hosted service, triggered by cron, GitHub, GitLab, Forgejo or Azure DevOps">
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- wordmark + tagline -->
  <text x="72" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#58a6ff">pi-dispatch</text>
  <text x="75" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#c9d1d9">Run the pi coding agent as a self-hosted service —</text>
  <text x="75" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#c9d1d9">on demand, on a cron, or on an issue on any of four forges.</text>

  <!-- differentiator chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">
    <text x="75" y="278" fill="#3fb950">●</text><text x="95" y="278" fill="#8b949e">container-isolated</text>
    <text x="256" y="278" fill="#d6a531">●</text><text x="276" y="278" fill="#8b949e">spend-capped before tokens</text>
    <text x="520" y="278" fill="#58a6ff">●</text><text x="540" y="278" fill="#8b949e">cron · CLI · webhook</text>
    <text x="75" y="312" fill="#a371f7">●</text><text x="95" y="312" fill="#8b949e">GitHub · GitLab · Forgejo · Azure DevOps</text>
  </g>

  <!-- mini /dispatch panel -->
  <g transform="translate(772,66)">
    <rect width="366" height="228" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="24" r="6" fill="#febc2e"/>
    <circle cx="68" cy="24" r="6" fill="#28c840"/>
    <text x="183" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#8b949e">pi — /dispatch</text>
    <g font-family="Consolas, monospace" font-size="14.5">
      <text x="24" y="74" fill="#3fb950" font-weight="700">● RUNNING</text>
      <text x="150" y="74" fill="#8b949e">2 waiting · 1 active</text>
      <text x="24" y="112" fill="#8b949e">day</text>
      <rect x="62" y="100" width="196" height="15" rx="3" fill="#21262d"/>
      <rect x="62" y="100" width="80" height="15" rx="3" fill="#3fb950"/>
      <text x="270" y="112" fill="#8b949e">6/25</text>
      <text x="24" y="150" fill="#58a6ff">label</text>
      <text x="92" y="150" fill="#c9d1d9">pi:fix</text>
      <text x="152" y="150" fill="#6e7681">→</text>
      <text x="172" y="150" fill="#c9d1d9">fix</text>
      <text x="212" y="150" fill="#58a6ff">[gitlab]</text>
      <text x="24" y="182" fill="#7ee787">✔ done</text>
      <text x="112" y="182" fill="#8b949e">gl-7c21 · fix · 54k</text>
      <text x="24" y="210" fill="#6e7681">↑↓ select · ↵ open · a add · q quit</text>
    </g>
  </g>
</svg>
